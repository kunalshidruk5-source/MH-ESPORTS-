name: Build MH ESPORTS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract MH ESPORTS ZIP
        run: |
          mkdir -p project
          unzip -q MHESPORTS.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle project
        id: find
        run: |
          ROOT=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs -r dirname)

          if [ -z "$ROOT" ]; then
            ROOT=$(find project -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -print -quit | xargs -r dirname)
          fi

          if [ -z "$ROOT" ]; then
            echo "No Gradle project found"
            exit 1
          fi

          VERSION=$(find "$ROOT" -type f -name "gradle-wrapper.properties" -print -quit | xargs -r sed -n 's/.*gradle-\([0-9][0-9.]*\)-.*/\1/p')

          if [ -z "$VERSION" ]; then
            VERSION="8.10.2"
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "gradle_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.find.outputs.gradle_version }}

      - name: Build APK
        working-directory: ${{ steps.find.outputs.root }}
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MH-ESPORTS-APK
          path: ${{ steps.find.outputs.root }}/app/build/outputs/apk/debug/*.apk
